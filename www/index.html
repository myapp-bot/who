:root{--bg:#0b1626;--sf:#14233a;--ln:#26405f;--tx:#eef3f8;--mu:#93a9c4;--ac:#4fd1c5;--on:#04211e;--fl:Lora,Georgia,serif;--fs:1.25rem;--r:18px}
[data-th=clair]{--bg:#f1f4f8;--sf:#fff;--ln:#d3dae3;--tx:#18222f;--mu:#586677;--ac:#0b7a75;--on:#fff}
[data-th=nuit]{--bg:#0f0f26;--sf:#1b1b3d;--ln:#34346b;--tx:#f0eefc;--mu:#a9a7d4;--ac:#e9b949;--on:#241a00}
[data-th=vert]{--bg:#0c1b15;--sf:#173026;--ln:#2c4d3f;--tx:#e9f4ee;--mu:#9fbdae;--ac:#7ddc9b;--on:#062414}
[data-th=sepia]{--bg:#ece0ca;--sf:#f8f0e0;--ln:#d4c2a2;--tx:#3a2c1a;--mu:#7a6648;--ac:#8a4b1f;--on:#fff}
[data-th=contraste]{--bg:#000;--sf:#111;--ln:#fff;--tx:#fff;--mu:#ddd;--ac:#ffe600;--on:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom));background:radial-gradient(900px 520px at 90% -5%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 62%),radial-gradient(700px 500px at -10% 35%,color-mix(in srgb,var(--ac) 9%,transparent),transparent 60%),var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:16px 18px 0}
header img{border-radius:11px;box-shadow:0 4px 16px color-mix(in srgb,var(--ac) 45%,transparent)}
h1{font:700 1.05rem Georgia,serif;letter-spacing:.18em;text-transform:uppercase;margin:0}
h2{font:700 1.4rem Georgia,serif;margin:10px 0}h3{margin:16px 0 8px;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);display:flex;gap:6px;align-items:center}
.hero h2{font:italic 700 2rem/1.1 Georgia,serif;margin:14px 0;background:linear-gradient(90deg,var(--tx),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
#main{padding:4px 16px}.in{animation:fi .28s ease both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
input,textarea,select,button,.btn{font:inherit;color:var(--tx);background:color-mix(in srgb,var(--sf) 88%,transparent);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;min-height:46px}
input,textarea{width:100%;margin:0 0 8px}.sx{flex:1}
button,.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s}button:active{transform:scale(.95)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:46px;height:46px;padding:0;border-radius:50%;flex:none}.ib.on{color:var(--ac);border-color:var(--ac)}.ib.on .ic,.fv.on .ic{fill:var(--ac)}.big{width:68px;height:68px}
.pri{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#fff));color:var(--on);border:0;font-weight:700;box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 40%,transparent)}
.err{color:#f2a7a3}.mu,small{color:var(--mu)}.warnt{color:#f2b36b}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.bar input,.bar select{flex:1;min-width:110px;margin:0}
.row,.card{display:flex;align-items:center;gap:10px;padding:12px;margin:0 0 10px;border-radius:var(--r);background:linear-gradient(145deg,color-mix(in srgb,var(--sf) 90%,#fff 5%),var(--sf));border:1px solid var(--ln);box-shadow:0 8px 24px rgba(0,0,0,.16)}
.card{display:block;padding:14px 16px}.card h3{margin-top:0}
.num{width:40px;height:40px;border-radius:13px;background:color-mix(in srgb,var(--ac) 18%,var(--sf));color:var(--ac);display:grid;place-items:center;font:700 .95rem Georgia,serif;flex:none}
.gr{flex:1;min-width:0}.gr b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gr small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

const VER='5.7.9',CHG={fr:'5.7.9 : audio du téléphone séparé des chants ; lecture directe sans copie ni ajout automatique à la bibliothèque. 5.7.7 : bouton de boucle cyclique pour les quatre modes avec confirmation. 5.7.6 : lecteur réorganisé, minuteur intégré au défilement et fenêtre de lecture corrigée. 5.7.5 : sélection groupée de chants Tononkira. 5.7.4 : suppression des mots parasites Tononkira, nettoyage des chants déjà importés et fenêtre de lecture corrigée. 5.7.3 : correction de compilation Android. 5.7.2 : minuteur visible pendant la lecture, nettoyage des paroles importées, liste compacte et filtres audio traduits. 5.7.1 : modes de lecture et minuteur compact. 5.7 : minuteur 30 min et durée cumulée, lecteur sans passage automatique, audio depuis un dossier du téléphone, menus simplifiés, déclarations de foi. 5.6 : tri des cultes, partage direct des sauvegardes avec Google Drive et restauration depuis Drive. 5.5 : gestion MP3 améliorée (aperçu dans la fiche, remplacement/retrait, filtre des chants avec ou sans audio et option d’inclure les fichiers audio dans les sauvegardes automatiques). 5.4 : design retravaillé (polices intégrées, lecteur compact avec vitesse, menus et cases personnalisés), premier lancement guidé. 5.3 : téléchargement de chants depuis tononkira.serasera.org (recherche par titre et auteur). 5.2 : impression et partage (PDF, texte), égaliseur, verset défilant personnalisable, bibliothèque compacte. 5.1 : corbeille 30 jours, annuler/rétablir, import Word/Excel, glisser-déposer. 5.0 : bibliothèque (inspirations, versets, leçons), 3 éléments par chant avec affichage avant/pendant/après, lecteur compact, statistiques détaillées, PWA.',mg:'5.7.9 : misaraka amin’ny lisitry ny hira ny audio an-telefaonina, alefa mivantana tsy adika ao amin’ny app. 5.7.7 : mampifandimby ny fomba famakiana efatra ny bokotra. 5.7.6 : nohavaozina ny mpilalao ary naseho tsara ny famantaranandro sy ny varavarankely famakiana. 5.7.5 : fisafidianana hira Tononkira maro miaraka. 5.7.4 : nesorina ny teny hafahafa avy amin’ny Tononkira, diovina koa ny hira efa nampidirina ary nohatsaraina ny varavarankelin’ny fomba famakiana. 5.7.3 : fanamboarana ny fahadisoana amin’ny fanangonana ny Android. 5.7.2 : miseho mandritra ny fihainoana ny famantaranandro, fanadiovana ny tononkira ampidirina, lisitra hira azo ahena ary sivana audio voadika. 5.7.1 : fomba famakiana sy famantaranandro kely. 5.5 : fanatsarana ny MP3 (fihainoana mialoha, fanoloana/fanesorana, sivana ary fampidirana amin’ny tahiry mandeha ho azy raha tiana). 5.4 : endrika vaovao (soratra tafiditra, mpilalao kely misy hafainganana), fanombohana voalohany notarihina. 5.3 : fakana hira avy amin’ny tononkira.serasera.org (lohateny sy mpihira). 5.2 : pirinty sy fizarana (PDF, soratra), égaliseur, andininy mandeha azo ovaina, rakitsary kely. 5.1 : fako 30 andro, foano/averina, fampidirana Word/Excel, misintona. 5.0 : rakitsary (inspiration, andininy, lesona), 3 isaky ny hira miaraka amin’ny fampisehoana alohan’ny/mandritra/aorian’ny hira, mpilalao kely, statistika feno, PWA.',en:'5.7.9: phone audio is browsed separately and played directly without copying it into the song library. 5.7.7: loop button cycles through the four modes with feedback. 5.7.6: reorganized player, integrated timer, and corrected playback dialog. 5.7.5: select and import multiple Tononkira songs together. 5.7.4: remove Tononkira injected words, clean previously imported songs and improve the playback-mode dialog. 5.7.3: fixed Android compilation error. 5.7.2: visible timer during service playback, cleaner lyrics imports, compact song list and translated audio filters. 5.7.1: four playback modes and compact timer. 5.7: 30-minute timer and song duration total, no automatic advance by default, audio folder access without copying tracks, simpler menus, faith declarations. 5.6: service search/sorting and Google Drive backup sharing/import. 5.5: improved MP3 management (preview, replace/remove, audio filter and optional inclusion in automatic backups). 5.4: reworked design (embedded fonts, compact player with speed, custom menus and checkboxes), guided first launch. 5.3: song download from tononkira.serasera.org (search by title and author). 5.2: print and share (PDF, text), equalizer, custom scrolling verse, compact library. 5.1: 30-day trash, undo/redo, Word/Excel import, drag and drop. 5.0: library (inspirations, verses, lessons), 3 items per song shown before/during/after, compact player, detailed statistics, PWA.'};

<div class="card"><button onclick="mqM()">${I_('ver')} ${t('mqt')}</button></div><div class="card"><button onclick="trashM()">${I_('trash')} ${t('tr')} (${trash.length})</button></div><div class="card"><button onclick="themesM()">${I_('list')} ${t('thS')}</button></div>
<div class="card"><h3>${t('ab')}</h3><p><b>WorshipFlow</b> ${VER}</p><p class="mu">${CHG[set.lang]||CHG.en}</p><button id="pwab" class="pri" onclick="pwaInstall()" ${dfp?'':'hidden'}>${I_('download')} ${t('inst')}</button></div>`};
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const ck=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h};
async function bu(silent,shareDrive=false){const d={ver:4,songs,services:svs,insps,set,audio:{}};const includeAudio=silent?!!set.autoAudio:!!($('#wa')&&$('#wa').checked);if(includeAudio)for(const s of songs){const a=await get('audio',s.id);if(a)d.audio[s.id]=await b64(a)}
  d.ck=ck(JSON.stringify(d));const ok=await saveBackup(`WorshipFlow-Backup-${today()}.json`,JSON.stringify(d),silent,shareDrive);if(ok){set.lbT=Date.now();saveSet()}if(!silent)render()}
async function saveBackup(name,json,silent,forceShare=false){const C=window.Capacitor&&Capacitor.Plugins,FS=C&&C.Filesystem;
  if(forceShare&&FS&&C.Share){try{const r=await FS.writeFile({path:name,data:json,directory:'CACHE',encoding:'utf8'});await C.Share.share({title:name,text:'Choisis Google Drive pour conserver cette sauvegarde.',files:[r.uri]});toast('Choisis Google Drive dans le partage Android');return true}catch(e){toast('Partage Google Drive indisponible : '+e.message);return false}}
  if(FS){for(const [dir,path] of [['EXTERNAL_STORAGE','Download/Backup/'],['DOCUMENTS','WorshipFlow/Backup/']]){try{await FS.writeFile({path:path+name,data:json,directory:dir,encoding:'utf8',recursive:true});toast(path+name);return true}catch(e){}}
    if(C.Share&&!silent){try{const r=await FS.writeFile({path:name,data:json,directory:'CACHE',encoding:'utf8'});await C.Share.share({title:name,files:[r.uri]});return true}catch(e){}}
    if(silent)return false}
  if(silent)return false;
  if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:name,startIn:'downloads',types:[{accept:{'application/json':['.json']}}]}),w=await h.createWritable();await w.write(json);await w.close();toast(name);return true}catch(e){if(e.name=='AbortError')return false}}
  dl(new Blob([json]),name);toast('Download/'+name);return true}
async function rs(f){if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){alert(t('er'));return}const c=d.ck;delete d.ck;if(c!=null&&c!=ck(JSON.stringify(d))){alert(t('er'));return}if(!d||!Array.isArray(d.songs)||!Array.isArray(d.services)||!Array.isArray(d.insps)){alert(t('er'));return}
  if($('#x4').value=='r'){for(const s of songs){await del('songs',s.id);await del('audio',s.id)}for(const s of svs)await del('services',s.id);for(const s of insps)await del('insps',s.id)}
  for(const s of d.songs||[])await put('songs',s);for(const s of d.services||[])await put('services',s);for(const s of d.insps||[])await put('insps',s);
  for(const id in d.audio||{})await put('audio',await(await fetch(d.audio[id])).blob(),+id);
  if(d.set)set={...set,...d.set};await saveSet();load()}
function xp(k){const L=songs.slice().sort((a,b)=>a.n-b.n);
  if(k=='txt')dl(new Blob([L.map(s=>`# ${s.title}\n${s.lyrics}`).join('\n\n')],{type:'text/plain'}),'chants.txt');
  if(k=='csv')dl(new Blob(['\ufeffn;titre;themes;paroles\n'+L.map(s=>[s.n,s.title,s.themes.join(','),s.lyrics.replace(/\n/g,' / ')].map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'}),'chants.csv');
  if(k=='doc')dl(new Blob([`<html><meta charset="utf-8"><body>${L.map(s=>`<h2>${s.n}. ${esc(s.title)}</h2><p>${esc(s.lyrics).replace(/\n/g,'<br>')}</p>`).join('')}</body></html>`],{type:'application/msword'}),'chants.doc')}
async function impS(f){if(!f)return;const x=await f.text();let a=[];
  if(/^\s*#/.test(x))x.split(/^#\s*/m).filter(z=>z.trim()).forEach(z=>{const i=z.indexOf('\n');a.push({title:z.slice(0,i<0?z.length:i).trim(),lyrics:i<0?'':z.slice(i+1).trim()})});else{try{a=JSON.parse(x)}catch(e){}}
  a=Array.isArray(a)?a.filter(s=>s&&s.title):[];if(!a.length){alert(t('er'));return}
  let n=nextN()-1,k=0;for(const s of a){if(songs.some(o=>norm(o.title)==norm(s.title)))continue;await put('songs',{id:Date.now()+k++,n:++n,title:String(s.title||'').trim(),lyrics:cleanLyrics(s.lyrics,{title:s.title,by:s.by}),themes:s.themes||[],insp:s.insp||'',notes:'',hasAudio:false})}load()}
function icon(sz){const c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,sz,sz);gr.addColorStop(0,'#14304f');gr.addColorStop(1,'#0e7c86');g.fillStyle=gr;g.beginPath();g.roundRect(0,0,sz,sz,sz*.22);g.fill();
  g.strokeStyle='#fff';g.lineWidth=sz*.05;g.lineCap='round';for(let i=0;i<3;i++){g.beginPath();for(let k=0;k<=32;k++){const x=.18+k*.02,y=.36+i*.14+Math.sin(x*9+i)*.05;k?g.lineTo(x*sz,y*sz):g.moveTo(x*sz,y*sz)}g.stroke()}return c}
function icons(){const u=icon(96).toDataURL();$('#lg').src=u;const sl=document.querySelector('#spl img');if(sl)sl.src=u;let l=document.querySelector('link[rel=icon]');if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l)}l.href=u}
const dIc=()=>[48,72,96,144,192,512,1024].forEach((s,i)=>setTimeout(()=>icon(s).toBlob(b=>dl(b,`icon-${s}.png`)),i*500));
load();
</script></body></html>
